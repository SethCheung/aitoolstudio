version: '3.8'

services:
  frontend:
    build:
      context: ./img-platform/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./img-platform/frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

  backend:
    build:
      context: ./img-platform/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./img-platform/backend:/app
      - ./data:/app/data  # 数据库和生成图像存储
    environment:
      - DATABASE_URL=sqlite:///./data/img_platform.db
      - IMAGES_DIR=/app/data/images
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
    restart: unless-stopped

  # Phase 3 添加 Redis 用于 Celery 任务队列
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data

volumes:
  redis_data:
