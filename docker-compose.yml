services:
  frontend:
    build:
      context: ./img-platform/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./img-platform/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./data/uploads:/app/uploads
      - ./data/config:/app/config
      - ./data/minimax-output:/root/minimax-output
    environment:
      - DATABASE_URL=sqlite:///./data/img_platform.db
      - IMAGES_DIR=/app/data/images
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
    restart: unless-stopped

  # Phase 3 添加 Redis 用于 Celery 任务队列
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data

volumes:
  redis_data:
