version: "3.9"

services:
  aitoolstudio:
    image: python:3.11-slim
    container_name: aitoolstudio
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python main.py"
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - ./API/.env:/app/API/.env
      - ./data:/app/data
      - ./assets/output:/app/assets/output
      - ./output:/app/output
    restart: unless-stopped

# 说明：
# 1) 本 compose 仅负责启动平台服务，不包含 ComfyUI。
# 2) ComfyUI 请外部部署，并通过 API/.env 的 COMFYUI_INSTANCES 配置地址。
