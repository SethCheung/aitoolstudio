services:
  xy-canvas:
    image: python:3.11-slim
    container_name: xy-canvas
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn main:app --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - ./API/.env:/app/API/.env
      - ./data:/app/data
      - /vol3/@team/SJM-MediaFile/AI-Tool-Studio/xy-canvas/input:/app/input
      - /vol3/@team/SJM-MediaFile/AI-Tool-Studio/xy-canvas/output:/app/output
      - /vol3/@team/SJM-MediaFile/AI-Tool-Studio/comfyui/workflows:/app/workflows/shared:ro
    restart: unless-stopped

# 60 生产部署说明：
# - 本服务替换原 3000 端口的 aitoolstudio-canvas。
# - 用户数据使用 data/users.json，支持从旧 data/auth.db 迁移过来的 pbkdf2_sha256 密码哈希。
# - input/output 落到 60 盘 AI-Tool-Studio/xy-canvas 下。
# - workflows/shared 只读挂载共享工作流目录，避免覆盖仓库自带 workflows。
