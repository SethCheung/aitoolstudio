      ## 工作环境

      - xy-canvas web UI: http://192.168.1.60:3000
      - 登录: sethchang / 12301230
      - 视频后端: 195/197/249 任一台 ComfyUI 8188（推荐 195, RTX 4090 48G）
      - Mac 本地 playwright: /usr/bin/python3 + /Users/apple/Library/Caches/ms-playwright
      - SSH 60: `sshpass -p '12301230' ssh sethchang@192.168.1.60`
      - SSH 195/197/249: `sshpass -p 'Sjm744546' ssh sjm@<ip>`

      ## 完整任务说明

      `/Users/apple/Documents/GitHub/aitoolstudio/.mavis/plans/team-wf-test-2026-06-09.md`

      必看测试方法 (Playwright 登录 / 选 workflow / 填输入 / 等结果) + 报告格式 (YAML)。

      ## 现有工具脚本可复用 (强烈建议)

      - `/tmp/v6_check_re/re_play.py` — 完整 web UI 验证脚本 (登录/进画布/视频节点/字段)
      - `/tmp/v6_check_re/test_output_video.py` — 模拟右键菜单
      - `/tmp/v6_check_re/test_final.py` — 注入 output 节点 + 跑转换函数
      - `/tmp/wf_test_scripts/wf_test_all.py` — 之前 worker 写的批处理脚本 (可能没跑完, 可参考)
      - `/tmp/wf_test_scripts/wf_test_run.log` — 之前的 log (在 1/11 处停止)

      ## 测试资产

      - 测试图片 `PHOTO_20260603_172636427.jpg` (在 195 ComfyUI input 目录)
      - 测试 prompt: `A calm cinematic shot of a woman reading a book at a wooden desk, soft window light, subtle camera movement, natural motion`
      - 负向: `blurry, low quality, distorted, watermark`

      ## 必做

      1. 写/复用 Python 脚本，按顺序跑你这 3 个 workflow
      2. 每个 workflow 输出 YAML 到 `/Users/apple/Documents/GitHub/aitoolstudio/.mavis/plans/wf_test_results/wf_<N>_<name>.yaml`
      3. 拉 PASS 的 mp4 到 `/tmp/wf_test_assets/<N>_<name>/`
      4. 写**组 A 部分报告** `/Users/apple/Documents/GitHub/aitoolstudio/.mavis/plans/wf_test_group_a_report.md`
         - 3 个 workflow 的 PASS/FAIL + 帧数/分辨率/大小/失败原因
         - 已知问题 (针对你这 3 个)

      ## 不要做

      - **不要改任何 workflow JSON** (只测不修)
      - 不要跑超过 1 次/每个 workflow (除非出错重试 1 次)
      - 不要测组 B/C 的 workflow (那是别的 worker 的活)
      - 不要调 vision MCP

      ## 完成标准

      - 3 个 workflow 全部有 YAML 记录
      - 失败的要有具体错误信息 (ssh 到 195/197/249 查 ComfyUI queue/history 验证)
      - PASS 的 mp4 下载到 /tmp/wf_test_assets/
      - 组 A 报告写完
      - 把脚本放在 /tmp/wf_test_scripts/group_a/ 供复用
    verify_prompt: |
      验证组 A worker 真实跑了 3 个 workflow。

      必查:
      1. `/Users/apple/Documents/GitHub/aitoolstudio/.mavis/plans/wf_test_group_a_report.md` 存在
