      - `POST /api/canvas-llm`  画布 LLM 调用
      - `POST /api/canvas-video`  画布视频（**不要真触发**，确认 endpoint 存在即可）
      - `POST /api/ms/generate`  ModelScope 通道
      - `POST /api/providers/test-connection`  Provider 连通性测试
      - `POST /api/providers/probe-async`  异步探测
      - `POST /api/providers/fetch-models` 拉取模型清单
      - `GET /api/providers/{provider_id}/fetch-models` 同上

      ### F.3 后台设置
      - `GET /api/providers` Provider 配置
      - `PUT /api/providers` **不要** 真改，用 `GET` 拿到当前状态记录即可
      - `GET /api/config/token` 配置 token
      - `PUT /api/comfyui/instances` **不要**真改
      - 列出 settings 页面 (`/api-settings`, `/comfyui-settings`) 是否 200
      - `GET /api-settings` `/comfyui-settings`  页面 HTTP 码

      ### F.4 更新与备份
      - `GET /api/update-backups`  列出可回滚的备份
      - `POST /api/update-from-github` **不要真触发**
      - `POST /api/update-rollback` **不要真触发**
      - 验证 endpoint 注册存在（用 grep main.py）

      ## 交付物
      写到：`/Users/apple/Documents/GitHub/aitoolstudio/.mavis/plans/detection-track-f.md`

      包含：
      1. **逐项探测表**：每个 API 的 HTTP 码 + 响应 + 判定
      2. **GPT/在线生图阻断原因**：是 API Key 没配、还是 endpoint 500、其他
      3. **Provider 配置现状**：哪些 key 已配、哪些没配（不要泄露真实 key，只列存在与否）
      4. **后台设置可达性**

      ## 约束
      - 不要真改 /api/providers
      - 不要真触发 update-from-github / update-rollback
      - 不要在响应里写真实 API Key
    verified_by: verifier
    verify_prompt: |
