<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <title>登录 - AI Studio</title>
    <script src="/static/js/auth.js?v=2026.05.28.2"></script>
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            background: #f6f7fb;
            color: #111827;
        }
        .card {
            width: min(92vw, 380px);
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }
        h1 { margin: 0 0 16px; font-size: 20px; }
        .field { margin-bottom: 12px; }
        .field label { display: block; font-size: 13px; color: #4b5563; margin-bottom: 6px; }
        .field input {
            width: 100%;
            height: 40px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 0 12px;
            font-size: 14px;
            outline: none;
        }
        .field input:focus { border-color: #111827; }
        button {
            width: 100%;
            height: 40px;
            border: none;
            border-radius: 8px;
            background: #111827;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
        button[disabled] { opacity: 0.7; cursor: wait; }
        .error { min-height: 20px; margin-top: 10px; font-size: 13px; color: #b91c1c; }
        .hint { margin-top: 12px; font-size: 12px; color: #6b7280; }
    </style>
</head>
<body>
    <form class="card" id="loginForm">
        <h1>登录 AI Studio</h1>
        <div class="field">
            <label for="username">用户名</label>
            <input id="username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
            <label for="password">密码</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button id="submitBtn" type="submit">登录</button>
        <div id="error" class="error"></div>
        <div class="hint">默认本地管理员可用环境变量覆盖，首次登录后请及时修改。</div>
    </form>
    <script>
        (function () {
            var form = document.getElementById('loginForm');
            var errorEl = document.getElementById('error');
            var submitBtn = document.getElementById('submitBtn');
            var usernameInput = document.getElementById('username');
            var passwordInput = document.getElementById('password');
            var nextPath = '/';
            try {
                var p = new URLSearchParams(window.location.search).get('next') || '/';
                if (p.startsWith('/') && !p.startsWith('//')) nextPath = p;
            } catch (e) {}

            StudioAuth.fetchMe().then(function (user) {
                if (user) window.location.replace(nextPath);
            });

            form.addEventListener('submit', async function (event) {
                event.preventDefault();
                errorEl.textContent = '';
                submitBtn.disabled = true;
                try {
                    var res = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({
                            username: usernameInput.value.trim(),
                            password: passwordInput.value
                        })
                    });
                    var data = await res.json().catch(function () { return {}; });
                    if (!res.ok) throw new Error(data.detail || '登录失败');
                    window.location.replace(nextPath);
                } catch (e) {
                    errorEl.textContent = e.message || '登录失败';
                } finally {
                    submitBtn.disabled = false;
                }
            });
        })();
    </script>
</body>
</html>
