<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <title>ComfyUI 工作台</title>
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'light';
                if (theme === 'dark') {
                    document.documentElement.classList.add('studio-theme-dark');
                    document.documentElement.classList.add('theme-dark');
                }
            } catch (e) {}
        })();
    </script>
    <script src="/static/vendor/js/lucide.js?v=2026.05.28.2"></script>
    <script src="/static/js/theme.js?v=2026.05.28.2"></script>
    <script src="/static/js/auth.js?v=2026.05.28.2"></script>
    <script>
        if (window.StudioAuth) {
            StudioAuth.guard({ requireAuth: true, redirect: true });
        }
    </script>
    <link rel="stylesheet" href="/static/css/comfyui-workbench.css?v=2026.05.28.2">
</head>
<body>
    <div class="workbench-shell">
        <header class="workbench-topbar">
            <div class="workbench-title">
                <span class="eyebrow">COMFYUI</span>
                <h1>ComfyUI 工作台</h1>
                <p id="pageSummary">正在读取 worker 状态...</p>
            </div>
            <div class="topbar-actions">
                <nav class="view-tabs" id="viewTabs">
                    <button id="tabWorkers" class="view-tab active" type="button">Worker 状态</button>
                    <button id="tabWorkflows" class="view-tab hidden" type="button">工作流试跑</button>
                </nav>
                <button id="backBtn" class="tool-btn" type="button">
                    <i data-lucide="arrow-left" class="icon-16"></i>
                    <span>项目主页</span>
                </button>
                <button id="refreshBtn" class="tool-btn" type="button">
                    <i data-lucide="refresh-cw" class="icon-16"></i>
                    <span>刷新</span>
                </button>
                <button id="settingsBtn" class="tool-btn hidden" type="button">
                    <i data-lucide="workflow" class="icon-16"></i>
                    <span>工作流设置</span>
                </button>
                <button id="themeToggleBtn" class="tool-btn icon-btn theme-toggle" type="button" title="切换深浅色" aria-label="切换深浅色">
                    <i data-lucide="moon" class="icon-16"></i>
                </button>
            </div>
        </header>

        <main class="workbench-main">
            <section id="workerView">
                <section class="status-strip">
                    <div class="metric">
                        <span>在线</span>
                        <strong id="onlineCount">0</strong>
                    </div>
                    <div class="metric">
                        <span>总数</span>
                        <strong id="totalCount">0</strong>
                    </div>
                    <div class="metric">
                        <span>队列</span>
                        <strong id="queueCount">0</strong>
                    </div>
                    <div class="metric wide">
                        <span>更新时间</span>
                        <strong id="updatedAt">-</strong>
                    </div>
                </section>

                <section id="messageBar" class="message-bar">加载中...</section>
                <section id="workerList" class="worker-list"></section>
            </section>

            <section id="workflowView" class="hidden">
                <section id="wfMessageBar" class="message-bar">加载中...</section>
                <div class="wf-layout">
                    <aside class="wf-list-pane">
                        <button id="importFromComfyBtn" class="primary-btn" type="button">
                            <i data-lucide="download" class="icon-14"></i>
                            <span>从 ComfyUI 跑通记录导入</span>
                        </button>
                        <div class="wf-filters" id="wfFilters">
                            <button class="wf-chip active" data-filter="all" type="button">全部</button>
                            <button class="wf-chip" data-filter="published" type="button">已发布</button>
                            <button class="wf-chip" data-filter="tested" type="button">已跑通</button>
                            <button class="wf-chip" data-filter="draft" type="button">待试跑</button>
                            <button class="wf-chip" data-filter="missing" type="button">缺依赖</button>
                        </div>
                        <input id="wfSearch" class="wf-search" type="text" placeholder="搜索工作流...">
                        <div id="wfList" class="wf-list"></div>
                    </aside>
                    <section class="wf-detail-pane" id="wfDetail">
                        <div class="wf-empty">在左侧选择一个工作流开始试跑</div>
                    </section>
                </div>
            </section>
        </main>
    </div>

    <template id="workerCardTpl">
        <article class="worker-card">
            <div class="worker-head">
                <div class="status-dot"></div>
                <div class="worker-main">
                    <h2 class="worker-address"></h2>
                    <p class="worker-reason"></p>
                </div>
                <span class="status-pill"></span>
            </div>
            <div class="worker-stats">
                <div class="stat-cell">
                    <span>GPU</span>
                    <strong class="worker-gpu"></strong>
                </div>
                <div class="stat-cell">
                    <span>VRAM</span>
                    <strong class="worker-vram"></strong>
                </div>
                <div class="stat-cell">
                    <span>Running</span>
                    <strong class="worker-running"></strong>
                </div>
                <div class="stat-cell">
                    <span>Pending</span>
                    <strong class="worker-pending"></strong>
                </div>
                <div class="stat-cell">
                    <span>Latency</span>
                    <strong class="worker-latency"></strong>
                </div>
            </div>
            <div class="worker-actions">
                <a class="primary-btn open-link" target="_blank" rel="noopener">
                    <i data-lucide="external-link" class="icon-14"></i>
                    <span>打开 ComfyUI / ComfyTV</span>
                </a>
                <button class="tool-btn copy-btn" type="button">
                    <i data-lucide="copy" class="icon-14"></i>
                    <span>复制地址</span>
                </button>
            </div>
        </article>
    </template>

    <div id="importDialog" class="wf-dialog-mask hidden">
        <div class="wf-dialog wf-dialog-wide">
            <h3>从 ComfyUI 跑通记录导入</h3>
            <p class="wf-dialog-sub">在 worker 的 ComfyUI（ComfyTV）里跑通工作流后，这里直接选那次运行导入平台；导入自带 API 格式与「已跑通」记录，确认参数后即可发布到画布。</p>
            <div class="wf-worker-select" id="importWorkerSelect"></div>
            <div id="importHistoryList" class="import-history-list"></div>
            <div class="wf-dialog-actions">
                <button id="importCancelBtn" class="tool-btn" type="button">关闭</button>
            </div>
        </div>
    </div>

    <div id="publishDialog" class="wf-dialog-mask hidden">
        <div class="wf-dialog">
            <h3 id="publishTitle">发布到画布</h3>
            <p class="wf-dialog-sub">勾选要暴露给普通用户的参数；未勾选的字段将隐藏并使用默认值。</p>
            <div id="publishFields" class="publish-fields"></div>
            <div class="wf-dialog-actions">
                <button id="publishCancelBtn" class="tool-btn" type="button">取消</button>
                <button id="publishConfirmBtn" class="primary-btn" type="button">确认发布</button>
            </div>
        </div>
    </div>

    <script src="/static/js/comfyui-workbench.js?v=2026.05.28.2"></script>
</body>
</html>
